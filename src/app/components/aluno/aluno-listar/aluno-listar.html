<div class="card">
  <p-toast />
  <p-toolbar class="mb-6">
    <ng-template #start>
      <p-button label="Novo" icon="pi pi-plus" class="mr-2" (onClick)="openNew()" />
      <p-button
        severity="danger"
        label="Delete"
        icon="pi pi-trash"
        outlined
        (onClick)="deleteSelectedAlunos()"
        [disabled]="!selectedAlunos || !selectedAlunos.length"
      />
    </ng-template>
    <ng-template #end>
      <p-fileUpload
        mode="basic"
        accept="image/*"
        [maxFileSize]="1000000"
        label="Import"
        chooseLabel="Importar"
        auto
        customUpload
        class="mr-2 inline-block"
        [chooseButtonProps]="{ severity: 'secondary' }"
      />
      <p-button label="Exportar" icon="pi pi-upload" severity="secondary" (onClick)="exportCSV()" />
    </ng-template>
  </p-toolbar>
  <p-table
    #dt
    [value]="alunos"
    [rows]="10"
    [columns]="cols"
    [paginator]="true"
    [globalFilterFields]="['id', 'nome', 'cpfCnpj', 'telefone', 'matricula']"
    [tableStyle]="{ 'min-width': '75rem' }"
    [(selection)]="selectedAlunos"
    [rowHover]="true"
    dataKey="id"
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
    [showCurrentPageReport]="true"
  >
    <ng-template #caption>
      <div class="flex items-center justify-between">
        <h5 class="m-0">Gerenciar Alunos</h5>
        <p-iconfield>
          <p-inputicon class="pi pi-search" />
          <input
            pInputText
            type="text"
            (input)="dt.filterGlobal($event.target.value, 'contains')"
            placeholder="Pesquisar..."
          />
        </p-iconfield>
      </div>
    </ng-template>
   <ng-template #header>
      <tr>
        <th style="width: 3rem" class="text-center">
          <p-tableHeaderCheckbox />
        </th>
        
        <th pSortableColumn="id" style="width: 5rem" class="text-center">
          Id <p-sortIcon field="id" />
        </th>
        
        <th style="min-width: 16rem" class="text-center">
          Nome
        </th>
        
        <th style="min-width: 12rem" class="text-center">
          CPF/CNPJ
        </th>
        
        <th style="min-width: 12rem" class="text-center">
          Telefone
        </th>
        
        <th style="min-width: 12rem" class="text-center">
          Matrícula
        </th>
        
        <th style="min-width: 12rem" class="text-center">
          Faculdade
        </th>
        
        <th style="min-width: 10rem" class="text-center">Ações</th>
      </tr>
    </ng-template>

    <ng-template #body let-aluno>
      <tr>
        <td style="width: 3rem" class="text-center">
          <p-tableCheckbox [value]="aluno" />
        </td>
        <td style="min-width: 5rem" class="text-center">{{ aluno.id }}</td>
        <td style="min-width: 16rem" class="text-center">{{ aluno.nome }}</td>
        <td style="min-width: 12rem" class="text-center">{{ aluno.cpfCnpj }}</td>
        <td style="min-width: 12rem" class="text-center">{{ aluno.telefone }}</td>
        <td style="min-width: 12rem" class="text-center">{{ aluno.matricula }}</td>

        <td style="min-width: 12rem" class="text-center">
          {{ aluno.faculdade?.nome || 'Não Vinculada' }}
        </td>
        
            <td class="text-center">
          <div class="flex justify-center">
          <p-button
            icon="pi pi-pencil"
            class="mr-2"
            [rounded]="true"
            [outlined]="true"
            (click)="editAluno(aluno)"
          />
          <p-button
            icon="pi pi-trash"
            severity="danger"
            [rounded]="true"
            [outlined]="true"
            (click)="deleteAluno(aluno)"
          />
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <p-dialog
    [(visible)]="alunoDialog"
    [style]="{ width: '450px' }"
    header="Detalhes do Aluno"
    [modal]="true"
  >
    <ng-template #content>
      <app-aluno-cadastro
        *ngIf="alunoDialog"
        [aluno]="aluno"
        [faculdades]="faculdades"
        (aoSalvar)="aoSalvarAluno()"
        (aoCancelar)="hideDialog()"
      >
      </app-aluno-cadastro>
    </ng-template>
  </p-dialog>

  <p-confirmdialog [style]="{ width: '450px' }" />
</div>
