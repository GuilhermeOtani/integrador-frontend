<div class="rota-formulario">
  <div class="rota-campos">
    
    <div class="rota-campo">
      <label for="nome" class="block font-bold">Nome da Rota</label>
      <input
        type="text"
        pInputText
        id="nome"
        [(ngModel)]="rota.nome"
        fluid
        autofocus
        placeholder="Ex: Rota Noturna UTFPR"
      />
      <small class="text-red-500" *ngIf="submitted && !rota.nome">
        O Nome da Rota é obrigatório.
      </small>
    </div>

    <div class="rota-campo">
      <label for="descricao" class="block font-bold">Descrição</label>
      <input 
        type="text" 
        pInputText 
        id="descricao" 
        [(ngModel)]="rota.descricao" 
        fluid 
        placeholder="Ex: Rota passando pelo centro"
      />
    </div>

    <div class="rota-itinerario">
      <label class="block font-bold">Itinerário (Pontos de Embarque)</label>
      <p-pickList 
        [source]="pontosDisponiveis" 
        [target]="pontosSelecionados" 
        dataKey="id"
        sourceAriaLabel="Pontos disponíveis" targetAriaLabel="Pontos selecionados na rota"
        rightButtonAriaLabel="Adicionar pontos à rota" leftButtonAriaLabel="Retirar pontos da rota"
        upButtonAriaLabel="Mover ponto para cima" downButtonAriaLabel="Mover ponto para baixo"
        breakpoint="640px"
        sourceHeader="Pontos Disponíveis" 
        targetHeader="Pontos Selecionados (Ordem da Rota)" 
        [dragdrop]="true" 
        [responsive]="true" 
        [sourceStyle]="{ height: '15rem' }" 
        [targetStyle]="{ height: '15rem' }"
      >
        <ng-template let-ponto pTemplate="item">
          <div class="flex items-center gap-2 p-2">
            <i class="pi pi-map-marker text-primary"></i>
            <span>{{ ponto.descricao }}</span>
          </div>
        </ng-template>
      </p-pickList>
      <small class="text-gray-500 block mt-2">
        Arraste os pontos para a direita para adicioná-los à rota. Você pode reordenar a lista da direita para definir o trajeto exato.
      </small>
    </div>

  </div>

  <hr class="rota-separador" />

  <div class="rota-acoes">
    <p-button label="Cancelar" icon="pi pi-times" text (onClick)="cancelar()" />
    <p-button label="Salvar" icon="pi pi-check" (onClick)="confirmarSalvar()" />
  </div>
</div>
