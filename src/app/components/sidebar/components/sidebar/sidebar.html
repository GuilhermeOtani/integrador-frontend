<div style="margin-top: 1rem; margin-left: 1rem">
  <p-button (onClick)="visible = true" icon="pi pi-bars" ariaLabel="Abrir menu" />
</div>

<p-drawer [(visible)]="visible" [style]="{ width: '290px', border: 'none' }">
  <ng-template #headless>
    <div class="flex flex-column h-full bg-surface-0 dark:bg-surface-900">
      <div class="flex align-items-center gap-3 px-5 py-4 shrink-0 border-bottom-1 surface-border">
        <div class="brand-icon flex align-items-center justify-content-center border-round-lg text-white">
          <i class="pi pi-send text-xl"></i>
        </div>
        <span class="font-extrabold text-2xl text-primary tracking-tight">BusSystem</span>
      </div>

      <nav class="flex-1 overflow-y-auto no-scrollbar p-3" aria-label="Navegação principal">
        @for (secao of secoes(); track secao.titulo) {
          <div class="nav-category-title px-3">{{ secao.titulo }}</div>
          <ul class="list-none p-0 m-0">
            @for (item of secao.itens; track item.rota) {
              <li>
                <a
                  pRipple
                  [routerLink]="item.rota"
                  routerLinkActive="active-route"
                  (click)="visible = false"
                  class="nav-link"
                >
                  <i [class]="item.icon + ' mr-3'"></i>
                  <span>{{ item.label }}</span>
                </a>
              </li>
            }
          </ul>
        }
      </nav>

      <div class="mt-auto border-top-1 surface-border p-3 shrink-0 bg-surface-50 dark:bg-surface-950">
        <div class="flex align-items-center justify-content-between gap-2">
          <div class="flex align-items-center gap-2 min-w-0">
            <p-avatar [label]="iniciais()" shape="circle" />
            <div class="flex flex-column min-w-0">
              <span class="font-semibold text-sm text-color white-space-nowrap overflow-hidden text-overflow-ellipsis">
                {{ auth.usuario()?.nome }}
              </span>
              <span class="text-xs text-color-secondary">{{ rotuloPapel() }}</span>
            </div>
          </div>
          <p-button
            icon="pi pi-sign-out"
            [rounded]="true"
            [text]="true"
            severity="secondary"
            size="small"
            pTooltip="Sair do sistema"
            tooltipPosition="top"
            ariaLabel="Sair do sistema"
            (onClick)="sair()"
          />
        </div>
      </div>
    </div>
  </ng-template>
</p-drawer>
