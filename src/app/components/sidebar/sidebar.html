<div style="margin-top: 1rem; margin-left: 1rem">
  <p-button (click)="visible = true" icon="pi pi-bars" />
</div>

<div class="card flex justify-center">
  <p-drawer #drawerRef [(visible)]="visible" [style]="{ width: '270px', border: 'none' }">
    <ng-template #headless>
      <div class="flex flex-col h-full bg-surface-0 dark:bg-surface-900">
        
        <div class="flex items-center gap-3 px-5 py-4 shrink-0 border-b border-surface-200 dark:border-surface-700">
            <svg width="35" height="35" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="block drop-shadow-md">
                <path d="M12 2L2 7.5L12 13L22 7.5L12 2Z" fill="var(--p-primary-color)" />
                <path d="M2 7.5V16.5L12 22V13L2 7.5Z" fill="var(--p-primary-color)" fill-opacity="0.8" />
                <path d="M22 7.5V16.5L12 22V13L22 7.5Z" fill="var(--p-primary-color)" fill-opacity="0.5" />
             </svg>
            <span class="font-extrabold text-2xl text-primary tracking-tight">BusSystem</span>
        </div>

        <div class="flex-1 overflow-y-auto no-scrollbar p-3">
          <ul class="list-none p-0 m-0">
            
            <li>
              <div class="nav-category-title px-3">Cadastros Base</div>
              <ul class="list-none p-0 m-0">
                <li>
                  <a pRipple routerLink="/alunos" routerLinkActive="active-route" (click)="visible = false" class="nav-link">
                    <i class="pi pi-users mr-3"></i>
                    <span>Alunos</span>
                  </a>
                </li>
                <li>
                  <a pRipple routerLink="/faculdades" routerLinkActive="active-route" (click)="visible = false" class="nav-link">
                    <i class="pi pi-building mr-3"></i>
                    <span>Faculdades</span>
                  </a>
                </li>
                <li>
                  <a pRipple routerLink="/motoristas" routerLinkActive="active-route" (click)="visible = false" class="nav-link">
                    <i class="pi pi-id-card mr-3"></i>
                    <span>Motoristas</span>
                  </a>
                </li>
                <li>
                  <a pRipple routerLink="/onibuss" routerLinkActive="active-route" (click)="visible = false" class="nav-link">
                    <i class="pi pi-truck mr-3"></i>
                    <span>Ônibus</span>
                  </a>
                </li>
              </ul>
            </li>

            <li>
              <div class="nav-category-title px-3">Financeiro</div>
              <ul class="list-none p-0 m-0">
                <li>
                  <a pRipple routerLink="/contapagar" routerLinkActive="active-route" (click)="visible = false" class="nav-link">
                    <i class="pi pi-money-bill mr-3"></i>
                    <span>Contas a Pagar</span>
                  </a>
                </li>
              </ul>
            </li>

            <li>
              <div class="nav-category-title px-3">Logística</div>
              <ul class="list-none p-0 m-0">
                <li>
                  <a pRipple routerLink="/pontosembarque" routerLinkActive="active-route" (click)="visible = false" class="nav-link">
                    <i class="pi pi-map-marker mr-3"></i>
                    <span>Pontos de Embarque</span>
                  </a>
                </li>
                <li>
                  <a pRipple routerLink="/rotas" routerLinkActive="active-route" (click)="visible = false" class="nav-link">
                    <i class="pi pi-map mr-3"></i>
                    <span>Rotas</span>
                  </a>
                </li>
                 <li>
                  <a pRipple routerLink="/grades" routerLinkActive="active-route" (click)="visible = false" class="nav-link">
                    <i class="pi pi-map mr-3"></i>
                    <span>Grades</span>
                  </a>
                </li>

              </ul>
            </li>
          </ul>
        </div>

            </div>

          </div>
        </div>
      </div>
    </ng-template>
  </p-drawer>
</div>
